[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "client-orchestrator-svc"
version = "0.1.0"
description = "End-to-end workflow automation, event routing, pipeline coordination, and service discovery"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "DeepMind Agentic Engineering", email = "agent@example.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "httpx>=0.27.0",
    "click>=8.1.7",
    "python-dotenv>=1.0.1",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
client-orchestrator = "src.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
